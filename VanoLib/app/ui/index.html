<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VanoLib</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,-apple-system,system-ui,sans-serif;font-size:13px;background:#111;-webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea{font:inherit;border:0;outline:0;background:none;color:inherit}

#switch{position:fixed;bottom:16px;right:22px;z-index:999;display:flex;gap:4px;padding:5px;border-radius:14px;background:rgba(20,20,22,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08)}
#switch button{padding:8px 14px;border-radius:10px;color:#aaa;font-weight:500;font-size:12px;transition:.2s}
#switch button.on{background:#fff;color:#111}
#switch button:hover:not(.on){color:#fff}
.concept{position:fixed;inset:0;display:none}
.concept.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:scale(.995)}to{opacity:1}}

.rdr{--rv:#e7e5e0;--rbar:rgba(255,255,255,.86);--rtx:#1f2328;--rmu:#6b6f76;--rbd:rgba(0,0,0,.08);--rac:#c4643f;--rside:#f5f4f1;--rpop:#fff;
  position:relative;display:flex;flex-direction:column;height:100%;width:100%;color:var(--rtx);background:var(--rv);overflow:hidden;transition:background .3s}
.rdr.t-sepia{--rv:#d9ccb1;--rbar:rgba(247,239,222,.86);--rtx:#3b2f20;--rmu:#7a6a55;--rbd:rgba(80,50,10,.1);--rside:#ece2cc;--rpop:#f8f1e2}
.rdr.t-night{--rv:#0e0e10;--rbar:rgba(30,30,34,.86);--rtx:#e6e3dd;--rmu:#9a968e;--rbd:rgba(255,255,255,.08);--rside:#161618;--rpop:#232327}
.rtb{display:flex;align-items:center;gap:2px;padding:6px 10px;background:var(--rbar);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--rbd);z-index:6;flex:none;white-space:nowrap;transition:opacity .35s,transform .35s;user-select:none}
.rtb button{height:30px;min-width:30px;padding:0 8px;border-radius:8px;color:var(--rmu);font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.rtb button:hover{background:var(--rbd);color:var(--rtx)}
.rtb button.on{color:var(--rac)}
.rtb .back{font-size:12.5px;font-weight:500;color:var(--rtx)}
.rtb .sep{width:1px;height:18px;background:var(--rbd);margin:0 6px;flex:none}
.rtb .pgin{width:40px;text-align:center;height:26px;border-radius:7px;background:var(--rbd);color:var(--rtx);font-family:'JetBrains Mono',monospace;font-size:12px}
.rtb .num{color:var(--rmu);font-family:'JetBrains Mono',monospace;font-size:12px;margin:0 4px}
.rtb .zl{font-family:'JetBrains Mono',monospace;font-size:12px!important;min-width:54px!important}
.rtb .sw{width:18px;height:18px;min-width:18px!important;padding:0!important;border-radius:50%;border:2px solid var(--rbd);margin:0 2px}
.rtb .sw.on{border-color:var(--rac)}
.rtb .title{flex:1;min-width:30px;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--rmu);padding:0 10px;text-align:center}
.rbody{flex:1;display:flex;min-height:0;position:relative}
.rprog{position:absolute;top:0;left:0;right:0;height:2px;z-index:7;pointer-events:none}
.rprog i{display:block;height:100%;width:0;background:var(--rac);transition:width .12s}
.rside{width:0;overflow:hidden;background:var(--rside);border-right:1px solid transparent;display:flex;flex-direction:column;transition:width .25s ease;flex:none}
.rdr.side .rside{width:224px;border-right-color:var(--rbd)}
.rstabs{display:flex;gap:2px;margin:12px;padding:3px;border-radius:9px;background:var(--rbd);min-width:200px}
.rstabs button{flex:1;padding:5px 4px;border-radius:7px;font-size:11.5px;color:var(--rmu);font-weight:500}
.rstabs button.on{background:var(--rpop);color:var(--rtx);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rspane{flex:1;overflow:auto;padding:4px 12px 60px;min-width:224px}
.rth{margin:0 auto 16px;width:128px;cursor:pointer;text-align:center;font-size:10.5px;color:var(--rmu)}
.rth .c{background:#fff;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.18);margin-bottom:5px;outline:2px solid transparent;outline-offset:3px;overflow:hidden;transition:outline-color .15s}
.rth.on .c{outline-color:var(--rac)}
.rth.on{color:var(--rac);font-weight:600}
.rth canvas{display:block;width:100%;height:100%}
.rdr.t-night .rth canvas{filter:invert(.9) hue-rotate(180deg)}
.rol div{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--rmu);line-height:1.35}
.rol div:hover{background:var(--rbd);color:var(--rtx)}
.rol .l1{padding-left:20px;font-size:11.5px}.rol .l2{padding-left:32px;font-size:11px}
.rhl{padding:10px;border-radius:10px;background:var(--rpop);margin-bottom:8px;cursor:pointer;font-size:12px;line-height:1.4;border-left:4px solid;position:relative}
.rhl small{display:block;color:var(--rmu);font-size:10.5px;margin-top:4px}
.rhl .x{position:absolute;top:4px;right:6px;color:var(--rmu);opacity:0;font-size:12px}
.rhl:hover .x{opacity:1}
.rmsg{color:var(--rmu);font-size:12px;line-height:1.5;padding:8px 4px}
.rview{flex:1;overflow:auto;position:relative;outline:none}
.rpages{padding:24px 24px 140px;display:flex;flex-direction:column;align-items:center;gap:18px;min-width:min-content}
.rdr.spread .rpages{display:grid;grid-template-columns:auto auto;justify-content:center;gap:18px 14px}
.pg{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1),0 12px 34px rgba(0,0,0,.09);flex:none;transition:background .3s}
.pg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.rdr.t-sepia .pg{background:#f4ead4}.rdr.t-sepia .pg canvas{mix-blend-mode:multiply}
.rdr.t-night .pg{background:#161618;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 12px 34px rgba(0,0,0,.5)}
.rdr.t-night .pg canvas{filter:invert(.9) hue-rotate(180deg)}
.pg .hlL{position:absolute;inset:0;z-index:1;pointer-events:none}
.pg .hlL i{position:absolute;border-radius:2px;mix-blend-mode:multiply;transition:box-shadow .3s}
.rdr.t-night .pg .hlL i{mix-blend-mode:screen;opacity:.6}
.pg .hlL i.flash{box-shadow:0 0 0 3px var(--rac)}
.pg .lnk{position:absolute;inset:0;z-index:3;pointer-events:none}
.pg .lnk a{position:absolute;pointer-events:auto;border-radius:2px;cursor:pointer}
.pg .lnk a:hover{background:rgba(60,120,255,.13)}
.pg .pgno{position:absolute;left:-44px;top:4px;font-size:10px;color:var(--rmu);font-family:'JetBrains Mono',monospace;opacity:.6}
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;line-height:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer span.markedContent{top:0;height:0}
.textLayer ::selection{background:rgba(70,130,255,.28)}
.textLayer br::selection{background:transparent}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.textLayer.selecting .endOfContent{top:0}
.textLayer mark{background:rgba(255,196,0,.45);color:transparent;border-radius:2px;padding:0}
.textLayer mark.cur{background:rgba(255,110,0,.62)}
.rempty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--rmu);line-height:1.8;padding:30px}
.rempty b{display:block;color:var(--rtx);font-weight:500;font-size:14px}
.rsearch{position:absolute;top:12px;right:18px;z-index:10;display:none;align-items:center;gap:4px;padding:5px 5px 5px 12px;border-radius:12px;background:var(--rpop);border:1px solid var(--rbd);box-shadow:0 10px 34px rgba(0,0,0,.16);color:var(--rmu)}
.rsearch.on{display:flex;animation:fade .15s}
.rsearch input{width:200px;color:var(--rtx);padding:5px 4px}
.rsearch .cnt{font-family:'JetBrains Mono',monospace;font-size:11px;min-width:58px;text-align:right;margin-right:4px}
.rsearch button{width:28px;height:28px;border-radius:7px}
.rsearch button:hover{background:var(--rbd);color:var(--rtx)}
.rsel{position:absolute;z-index:12;display:none;align-items:center;gap:4px;padding:5px 6px;border-radius:11px;background:var(--rpop);border:1px solid var(--rbd);box-shadow:0 10px 30px rgba(0,0,0,.18);transform:translate(-50%,-100%)}
.rsel.on{display:flex;animation:fade .12s}
.rsel .c{width:20px;height:20px;border-radius:50%;border:2px solid var(--rpop);box-shadow:0 0 0 1px var(--rbd)}
.rsel .c:hover{transform:scale(1.15)}
.rsel .t{padding:4px 8px;border-radius:7px;font-size:12px;color:var(--rmu)}
.rsel .t:hover{background:var(--rbd);color:var(--rtx)}
.rdrop{position:absolute;inset:10px;z-index:30;border:2px dashed var(--rac);border-radius:16px;background:color-mix(in srgb,var(--rv) 85%,transparent);display:none;place-items:center;font-size:15px;font-weight:500;color:var(--rac)}
.rdr.drag .rdrop{display:grid}
.rtoast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--rtx);color:var(--rv);padding:8px 14px;border-radius:10px;font-size:12px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none}
.rtoast.on{opacity:.92}

#A{--bg:#f4f1ea;--side:#ece8df;--pane:#faf8f3;--card:#fff;--tx:#1d1b18;--mu:#857f74;--fa:#b5afa3;--bd:rgba(40,30,10,.08);--ac:#c4643f;--acs:rgba(196,100,63,.1);--sh:0 1px 2px rgba(40,30,10,.04),0 6px 24px rgba(40,30,10,.05);background:var(--bg);color:var(--tx)}
#A.dark{--bg:#161513;--side:#1b1a17;--pane:#1f1d1a;--card:#25231f;--tx:#ebe6dc;--mu:#958f83;--fa:#5f5a51;--bd:rgba(255,240,210,.07);--ac:#e08560;--acs:rgba(224,133,96,.14);--sh:0 1px 2px rgba(0,0,0,.3)}
#A .wrap{display:grid;grid-template-columns:228px 410px 1fr;height:100%}
#A aside{background:var(--side);padding:22px 14px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--bd)}
#A .logo{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
#A .logo i{width:28px;height:28px;border-radius:8px;background:var(--ac);color:#fff;font-style:normal;display:grid;place-items:center;font-family:Newsreader;font-size:17px;font-weight:600}
#A .logo b{font-family:Newsreader;font-size:19px;font-weight:500}
#A .sec{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fa);padding:18px 10px 6px;font-weight:600}
#A .nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--mu);font-weight:500;transition:.15s;cursor:pointer}
#A .nav:hover{background:var(--bd);color:var(--tx)}
#A .nav.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
#A .nav .n{margin-left:auto;font-size:11px;color:var(--fa)}
#A .dot{width:8px;height:8px;border-radius:50%;flex:none}
#A .side-foot{margin-top:auto;padding:10px;color:var(--fa);font-size:11px;line-height:1.5}
#A .list{background:var(--pane);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
#A .lh{padding:22px 20px 12px}
#A .lh h2{font-family:Newsreader;font-weight:500;font-size:24px;margin-bottom:14px}
#A .search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;color:var(--mu);box-shadow:var(--sh)}
#A .search input{flex:1;color:var(--tx)}
#A .search kbd{font-family:Inter;font-size:10px;border:1px solid var(--bd);border-radius:4px;padding:1px 5px;color:var(--fa)}
#A .chips{display:flex;gap:6px;padding:12px 20px 8px;flex-wrap:wrap}
#A .chip{padding:5px 11px;border-radius:20px;border:1px solid var(--bd);color:var(--mu);font-size:12px;transition:.15s}
#A .chip.on{background:var(--tx);color:var(--pane);border-color:transparent}
#A .items{overflow:auto;padding:4px 12px 80px;flex:1}
#A .it{padding:14px 12px;border-radius:12px;cursor:pointer;transition:background .15s;position:relative}
#A .it:hover{background:var(--bd)}
#A .it.on{background:var(--card);box-shadow:var(--sh)}
#A .it .t{font-family:Newsreader;font-size:16px;line-height:1.3;font-weight:500;margin-bottom:6px;padding-right:20px}
#A .it .m{display:flex;align-items:center;gap:7px;color:var(--mu);font-size:11.5px}
#A .it .star{position:absolute;right:12px;top:15px;color:var(--ac);font-size:13px}
#A .prog{height:2px;background:var(--bd);border-radius:2px;margin-top:9px;overflow:hidden}
#A .prog i{display:block;height:100%;background:var(--ac)}
#A .detail{overflow:auto;padding:56px 64px 100px;position:relative}
#A .detail .inner{max-width:640px;margin:0 auto;animation:fade .3s}
#A .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:var(--acs);color:var(--ac);font-size:11.5px;font-weight:500}
#A .detail h1{font-family:Newsreader;font-weight:500;font-size:34px;line-height:1.18;margin:18px 0 14px;letter-spacing:-.01em}
#A .detail .who{color:var(--mu);font-size:14px;margin-bottom:28px}
#A .actions{display:flex;gap:8px;margin-bottom:36px;flex-wrap:wrap}
#A .btn{padding:10px 18px;border-radius:10px;font-weight:500;border:1px solid var(--bd);background:var(--card);transition:.15s;box-shadow:var(--sh)}
#A .btn:hover{transform:translateY(-1px)}
#A .btn.pri{background:var(--ac);color:#fff;border-color:transparent}
#A .detail .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fa);font-weight:600;margin-bottom:10px}
#A .detail .ab{font-family:Newsreader;font-size:18px;line-height:1.65;opacity:.92;margin-bottom:36px}
#A .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#A .grid div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
#A .grid small{display:block;color:var(--fa);font-size:11px;margin-bottom:3px}
#A .tgl{position:absolute;top:18px;right:20px;width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);z-index:5}
#A .reader{position:fixed;inset:0;display:none;z-index:50}
#A .reader.on{display:block;animation:fade .3s}
#A .rdr{--rac:#c4643f}
#A .rdr.t-day{--rv:#e9e4d9;--rbar:rgba(255,253,248,.8);--rside:#f1ece2;--rpop:#fffdf8;--rtx:#1d1b18;--rmu:#7b756a;--rbd:rgba(60,40,10,.09)}
#A .rtb{position:absolute;top:14px;left:50%;transform:translateX(-50%);border-radius:14px;border:1px solid var(--rbd);box-shadow:0 8px 30px rgba(0,0,0,.12);padding:5px 8px}
#A .rtb .title{display:none}
#A .rdr.idle .rtb{opacity:0;transform:translate(-50%,-10px);pointer-events:none}
#A .rpages{padding-top:78px}
#A .rsearch{top:66px}
#A .rstabs{margin-top:16px}

#B{--bg:#0c0d11;--p1:#121319;--p2:#171920;--bd:#22252e;--bd2:#2c303b;--tx:#e8eaf0;--mu:#8b91a1;--fa:#575c6a;--ac:#8b93ff;--ac2:#b78bff;background:var(--bg);color:var(--tx)}
#B .wrap{display:grid;grid-template-columns:60px 400px 1fr;height:100%}
#B .rail{background:var(--bg);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px}
#B .rail .lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:700;margin-bottom:16px;box-shadow:0 0 24px rgba(139,147,255,.35)}
#B .rail button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--fa);font-size:17px;position:relative;transition:.15s}
#B .rail button:hover,#B .rail button.on{color:var(--tx);background:var(--p2)}
#B .rail button.on::before{content:'';position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--ac)}
#B .rail .b{position:absolute;top:4px;right:4px;min-width:15px;height:15px;border-radius:8px;background:var(--ac);color:#0c0d11;font-size:9px;font-weight:700;display:grid;place-items:center}
#B .list{background:var(--p1);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
#B .lh{padding:16px 16px 10px;border-bottom:1px solid var(--bd)}
#B .cmd{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;background:var(--p2);border:1px solid var(--bd);color:var(--fa);text-align:left;transition:.15s}
#B .cmd:hover{border-color:var(--bd2);color:var(--mu)}
#B .cmd kbd{margin-left:auto;font-family:Inter;font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--bg);border:1px solid var(--bd2);color:var(--mu)}
#B .seg{display:flex;gap:2px;margin-top:12px;background:var(--bg);padding:3px;border-radius:9px;border:1px solid var(--bd)}
#B .seg button{flex:1;padding:6px;border-radius:7px;color:var(--mu);font-size:12px;font-weight:500}
#B .seg button.on{background:var(--p2);color:var(--tx)}
#B .stats{display:flex;gap:16px;padding:10px 16px;border-bottom:1px solid var(--bd);font-size:11px;color:var(--fa)}
#B .stats b{color:var(--tx);font-weight:600;margin-right:3px}
#B .items{overflow:auto;flex:1;padding-bottom:80px}
#B .grp{padding:14px 16px 6px;font-size:10.5px;color:var(--fa);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#B .it{display:flex;gap:12px;padding:11px 16px;cursor:pointer;border-left:2px solid transparent;transition:background .12s}
#B .it:hover{background:rgba(255,255,255,.025)}
#B .it.on{background:linear-gradient(90deg,rgba(139,147,255,.1),transparent);border-left-color:var(--ac)}
#B .it .src{width:6px;height:6px;border-radius:50%;margin-top:7px;flex:none}
#B .it .t{font-weight:500;line-height:1.38;margin-bottom:4px;font-size:13.5px}
#B .it .m{color:var(--fa);font-size:11.5px;display:flex;gap:8px;align-items:center}
#B .it .cat{font-family:'JetBrains Mono';font-size:10.5px;color:var(--mu);padding:1px 6px;border-radius:4px;background:var(--p2)}
#B .it .pb{height:2px;background:var(--bd);border-radius:2px;margin-top:7px;overflow:hidden;width:120px}
#B .it .pb i{display:block;height:100%;background:var(--ac)}
#B .main{display:flex;flex-direction:column;min-width:0;min-height:0}
#B .tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--bd);background:var(--bg);overflow:hidden;flex:none}
#B .tab{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px 9px 0 0;color:var(--fa);max-width:230px;font-size:12px;white-space:nowrap;cursor:pointer}
#B .tab span{overflow:hidden;text-overflow:ellipsis}
#B .tab.on{background:var(--p1);color:var(--tx)}
#B .tab .x{opacity:.4;font-size:14px}
#B .tab .x:hover{opacity:1}
#B .rh{flex:1;min-height:0}
#B .rdr,#B .rdr.t-night,#B .rdr.t-sepia{--rv:#0c0d11;--rbar:#121319;--rtx:#e8eaf0;--rmu:#8b91a1;--rbd:#262934;--rac:#8b93ff;--rside:#101116;--rpop:#1a1c23}
#B .rtb{backdrop-filter:none}
#B .pg{box-shadow:0 0 0 1px #22252e,0 24px 70px rgba(0,0,0,.55)}
#B .rview{background:radial-gradient(1200px 400px at 50% -100px,rgba(139,147,255,.07),transparent)}
#B .pal{position:fixed;inset:0;background:rgba(5,6,9,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;z-index:60;padding-top:14vh}
#B .pal.on{display:block;animation:fade .18s}
#B .pbox{width:600px;max-width:92vw;margin:0 auto;background:rgba(23,25,32,.96);border:1px solid var(--bd2);border-radius:16px;box-shadow:0 30px 100px rgba(0,0,0,.6);overflow:hidden}

<script>
const b64bytes=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const ESC=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

const PDFJS_LOCAL='/vendor/pdfjs/',PDFJS_CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsP=null;
function addScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{s.remove();rej(new Error('load '+src))};document.head.appendChild(s)})}
function loadPdfjs(){
  if(pdfjsP)return pdfjsP;
  pdfjsP=(async()=>{
    try{await addScript(PDFJS_LOCAL+'pdf.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_LOCAL+'pdf.worker.min.js';return window.pdfjsLib}catch(e){}
    await addScript(PDFJS_CDN+'pdf.min.js');const L=window.pdfjsLib;
    try{const t=await (await fetch(PDFJS_CDN+'pdf.worker.min.js')).text();L.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:'text/javascript'}))}catch(e){L.GlobalWorkerOptions.workerSrc=PDFJS_CDN+'pdf.worker.min.js'}
    return L})().catch(e=>{pdfjsP=null;throw e});
  return pdfjsP;
}
const HLC={yellow:'rgba(255,212,0,.5)',green:'rgba(90,205,120,.45)',blue:'rgba(90,155,255,.4)',pink:'rgba(255,105,165,.42)'};
const HLB={yellow:'#f2c94c',green:'#5acd78',blue:'#5a9bff',pink:'#ff69a5'};
const READERS=[];

class Reader{

    this.o=Object.assign({side:false,hlTab:true,back:null,theme:'day',autohide:false},o);
    this.host=host;this.states={};this.hls={};this.gen=0;this.sg=0;this.scale=1;this.fit='auto';this.spread=false;this.hits=[];this.hitIdx=0;this.tab='th';
    READERS.push(this);this.build();
  }
  $(s){return this.rdr.querySelector(s)}
  build(){
    this.host.innerHTML=`<div class="rdr t-${this.o.theme} ${this.o.side?'side':''} ${this.o.autohide?'ah':''}">
     <div class="rtb">
      <button data-a="side" title="Sidebar: pages, outline${this.o.hlTab?', highlights':''}">▥</button>

      <button data-a="zout" title="Zoom out (⌘−)">−</button><button data-a="z100" class="zl" title="Actual size">100%</button><button data-a="zin" title="Zoom in (⌘+ or pinch)">+</button>

      <span class="title"></span>
      <button class="sw" data-t="day" style="background:#fff" title="Day"></button><button class="sw" data-t="sepia" style="background:#f1e4c8" title="Sepia"></button><button class="sw" data-t="night" style="background:#1d1d20" title="Night (smart dark: colours preserved)"></button>
      <span class="sep"></span>
      <button data-a="find" title="Search in document (⌘F)">⌕</button><button data-a="open" title="Open a PDF from your computer (or drag &amp; drop)">⇪</button><button data-a="fs" title="Full screen">⛶</button>

     </div>
     <div class="rbody">
      <div class="rprog"><i></i></div>
      <div class="rside"><div class="rstabs"><button data-s="th" class="on">Pages</button><button data-s="ol">Outline</button>${this.o.hlTab?'<button data-s="hl">Highlights</button>':''}</div><div class="rspane"></div></div>

      <div class="rempty"><div><b>No paper open</b>Pick an article, or drop a PDF here.</div></div>
      <div class="rsearch"><span>⌕</span><input placeholder="Find in document"><span class="cnt"></span><button data-a="sprev" title="Previous (⇧↵)">↑</button><button data-a="snext" title="Next (↵)">↓</button><button data-a="sclose" title="Close (esc)">✕</button></div>

  function drawPal(){const v=$('#B-pq').value,ql=v.toLowerCase(),A=ACTS.filter(x=>x[1].toLowerCase().includes(ql));let h='';
    if(v.trim())h+=`<div class="g">Library</div><div class="r" data-all="1"><span>⌕</span>Show all results for “${ESC(v)}”<small>list</small></div>`;
    if(pal_items.length)h+='<div class="g">Papers</div>'+pal_items.map((a,i)=>`<div class="r" data-i="${i}"><span style="width:7px;height:7px;border-radius:50%;flex:none;background:${catColor(a.category)}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ESC(a.title)}</span><small>${ESC(short(a.authors))} · ${a.year}</small></div>`).join('');
    if(A.length)h+='<div class="g">Commands</div>'+A.map(x=>`<div class="r" data-c="${ACTS.indexOf(x)}"><span>${x[0]}</span>${x[1]}<small>${x[2]}</small></div>`).join('');
    $('#B-pres').innerHTML=h||'<div style="padding:24px;text-align:center;color:var(--fa)">Type to search 300k+ papers</div>';pi=0;hl();$$('#B-pres .r').forEach(r=>r.onclick=()=>pick(r))}
  const hl=()=>$$('#B-pres .r').forEach((r,i)=>r.classList.toggle('on',i===pi));
  function pick(r){const v=$('#B-pq').value;closeP();if(!r)return;if(r.dataset.all)setQ(v.trim());else if(r.dataset.i)open(pal_items[+r.dataset.i]);else ACTS[+r.dataset.c][3]()}
  const openP=()=>{$('#B-pal').classList.add('on');$('#B-pq').value='';pal_items=[];drawPal();$('#B-pq').focus();setTimeout(()=>$('#B-pq').focus(),20)},closeP=()=>$('#B-pal').classList.remove('on');
  $('#B-cmd').onclick=openP;$('#B-pq').oninput=()=>{drawPal();palSearch($('#B-pq').value)};$('#B-pal').onclick=e=>{if(e.target.id==='B-pal')closeP()};
  $('#B-syncb').onclick=syncNow;
  document.addEventListener('keydown',e=>{if(CUR!=='B')return;
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openP();return}
    if($('#B-pal').classList.contains('on')){const Rr=$$('#B-pres .r');if(e.key==='Escape')closeP();if(e.key==='ArrowDown'){pi=Math.min(Rr.length-1,pi+1);hl();e.preventDefault()}if(e.key==='ArrowUp'){pi=Math.max(0,pi-1);hl();e.preventDefault()}if(e.key==='Enter')pick(Rr[pi]);return}
    if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||e.metaKey||e.ctrlKey)return;const L=P.all,i=L.findIndex(a=>a.uid===act);
    if(e.key==='j'&&L[i+1])open(L[i+1]);if(e.key==='k'&&i>0)open(L[i-1])});
  onOV(()=>{$('#B-nread').textContent=OV.to_read||'';$('#B-tot').textContent=fmtN(OV.total);$('#B-pdf').textContent=fmtN(OV.pdfs);$('#B-sync').textContent=syncLabel()});
  ENTER.B=async()=>{if(started)return;started=true;R.setTheme(rTheme('B')||'night',true);P.reset();
    const r=await api('articles',{filter:'cont',limit:1});if(r.items&&r.items[0]&&!act)open(r.items[0])};
})();

(()=>{let cur=null,rt='notes',started=false,q='';const META={};
  const R=new Reader($('#C-rh'),{...HOOKS,side:true,hlTab:false,theme:'day',onTheme:t=>saveTheme('C',t),onHL:()=>rpan(),
    onOpen:doc=>{if(doc.file){cur={uid:doc.key,title:doc.title,authors:'Local file',category:'—',published:'',file:true};crumb();rpan()}}});
  const ring=(p)=>`<svg class="ring" viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="none" stroke="#e3f1ed" stroke-width="5"/><circle cx="26" cy="26" r="22" fill="none" stroke="#1f7a68" stroke-width="5" stroke-linecap="round" stroke-dasharray="${138.2*p/100} 200" transform="rotate(-90 26 26)"/><text x="26" y="30" text-anchor="middle" font-size="12" font-weight="600" fill="#14181f" font-family="Inter">${p}%</text></svg>`;
  const th=()=>`<div class="thumb">${'<i></i>'.repeat(7)}</div>`;
  const reg=L=>L.forEach(a=>META[a.uid]=a);
  const fi=a=>`<div class="fi" data-u="${ESC(a.uid)}">${th()}<div style="min-width:0;flex:1"><div class="t">${ESC(a.title)}</div><div class="m"><span style="width:7px;height:7px;border-radius:50%;flex:none;background:${catColor(a.category)}"></span>${ESC(short(a.authors))} · ${a.year}<span class="tag">${ESC(a.category)}</span>${a.has_pdf?'<span>⇣</span>':''}</div>${q?`<div class="ab">${ESC(a.abstract)}</div>`:''}</div><button class="add ${a.to_read?'on':''}" data-r="${ESC(a.uid)}" title="To Read">${a.to_read?'✓':'+'}</button></div>`;
  async function home(){if(cur&&!cur.file)R.saveState();cur=null;$('#C-rd').classList.remove('on');$('#C-home').style.display='block';$('#C-crumb').innerHTML='<b>Desk</b>';
    if(q)return results();
    const D=await api('desk');if(D.error){$('#C-home').innerHTML=`<div class="empty-row">${ESC(D.error)}</div>`;return}
    reg(D.continue);reg(D.queue);reg(D.feed);const h=new Date().getHours(),hi=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
    let g='',feed='';D.feed.forEach(a=>{const b=bucket(a.published);if(b!==g){g=b;feed+=`<div class="day">${b}</div>`}feed+=fi(a)});
    const mx=Math.max(1,...D.week.map(w=>w.pages));
    $('#C-home').innerHTML=`<div class="hi">${hi}.</div><div class="sub">${fmtN(D.new_week)} new papers this week · ${OV.to_read} in your queue · <span id="C-sync">${ESC(syncLabel())}</span> · <button id="C-syncb">Sync now</button></div>
    <h3>Continue reading</h3><div class="row">${D.continue.length?D.continue.map(a=>`<div class="cont" data-u="${ESC(a.uid)}">${ring(a.progress)}<div><div class="t">${ESC(a.title)}</div><div class="m">${ESC(short(a.authors))} · p. ${a.page||1} / ${a.pages||'?'}</div></div></div>`).join(''):'<div class="empty-row">Papers you start reading will appear here.</div>'}</div>
    <div class="cols"><div><h3>New in your categories <small>· ${(OV.settings.pinned||[]).join(', ')}</small></h3><div class="feed">${feed||'<div class="empty-row">No papers yet.</div>'}</div></div>
    <div><h3>Your week</h3><div class="shelf"><div class="stat"><div><b>${fmtN(OV.total)}</b><small>papers indexed</small></div><div><b>${D.pages_week}</b><small>pages read this week</small></div></div>
    <div style="font-size:11px;color:var(--fa)">Pages read / day</div><div class="bars">${D.week.map((w,i)=>`<i class="${i===6?'h':''}" style="height:${Math.max(4,100*w.pages/mx)}%" title="${w.pages} pages"></i>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--fa);margin-bottom:16px">${D.week.map(w=>`<span>${w.d}</span>`).join('')}</div>
    <h3 style="margin-top:6px">To Read queue <small>${OV.to_read}</small></h3>${D.queue.map(a=>`<div class="sh-it" data-u="${ESC(a.uid)}">${th()}<div class="t">${ESC(a.title)}</div></div>`).join('')||'<div class="empty-row">Add papers with +</div>'}</div></div></div>`;
    $('#C-syncb').onclick=syncNow}
  let RP=null;
  function results(){$('#C-home').innerHTML=`<div class="results"><h3>Results for “${ESC(q)}” <small id="C-rc"></small></h3><div class="feed" id="C-res" style="max-height:calc(100vh - 150px);overflow:auto"></div></div>`;
    RP=Pager($('#C-res'),(o,l)=>api('articles',{q,offset:o,limit:l}),items=>{reg(items);return items.map(fi).join('')});RP.onTotal=t=>$('#C-rc').textContent='· '+fmtN(t);RP.emptyMsg='No paper matches.';RP.reset()}
  $('#C-home').addEventListener('click',async e=>{const r=e.target.closest('[data-r]');if(r){const x=await api('toggle_read',{uid:r.dataset.r});const a=META[r.dataset.r];if(a)a.to_read=x.to_read;r.classList.toggle('on',x.to_read);r.textContent=x.to_read?'✓':'+';refreshOV();return}
    const u=e.target.closest('[data-u]');if(u)open(META[u.dataset.u])});
  $('#C-q').oninput=debounce(()=>{q=$('#C-q').value.trim();if(cur)home();else if(q)results();else home()},300);
  $('#C-q').onkeydown=e=>{if(e.key==='Escape'){$('#C-q').value='';q='';home()}};
  function crumb(){$('#C-crumb').innerHTML=`<a id="C-back">Desk</a> › <b>${ESC(cur.title)}</b>`;$('#C-back').onclick=home}
  function open(a){if(!a)return;cur=a;$('#C-home').style.display='none';$('#C-rd').classList.add('on');crumb();rpan();R.open(docFor(a))}
  function rpan(){if(!cur)return;$$('#C-rt button').forEach(b=>b.classList.toggle('on',b.dataset.t===rt));const a=cur,B=$('#C-rbody');
    if(rt==='notes'){const L=R.hls[R.key]||[];
      B.innerHTML=(L.map(h=>`<div class="note" data-id="${h.id}"><q style="border-color:${HLB[h.color]}">${ESC(h.text.slice(0,240))}${h.text.length>240?'…':''}</q><textarea placeholder="Add a note…">${ESC(h.note)}</textarea><small><span>p. ${h.page} · ${new Date(h.at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span><button data-del="${h.id}">Delete</button></small></div>`).join(''))+
      `<div class="hint"><b>Highlight &amp; annotate</b><br>Select text in the PDF, pick a colour, then write your note here. Click a quote to jump back to it. Notes are saved automatically.</div>`;
      $$('.note',B).forEach(n=>{const h=L.find(x=>x.id==n.dataset.id);$('textarea',n).oninput=e=>{h.note=e.target.value;R.noteChanged()};$('q',n).onclick=()=>R.gotoHL(h.id);$('[data-del]',n).onclick=()=>R.delHL(h.id)})}
    else{B.innerHTML=`<div class="kv"><span>Authors</span><b>${ESC(a.authors)}</b><span>Published</span><b>${fmtDate(a.published)}</b><span>Category</span><b>${ESC(a.category)}</b><span>arXiv id</span><b>${ESC(a.ext_id||'—')}</b><span>Pages</span><b>${R.n||'—'}</b></div>
      ${a.file?'':`<button class="btnc" id="C-tr">${a.to_read?'✓ In To Read':'＋ Add to To Read'}</button><button class="btnc sec" id="C-web">↗ Open on arXiv</button><button class="btnc sec" id="C-bib">⧉ Copy BibTeX</button>`}
      ${a.abstract?`<div class="abs">${ESC(a.abstract)}</div>`:''}`;
      if(!a.file){$('#C-tr').onclick=async()=>{const r=await api('toggle_read',{uid:a.uid});a.to_read=r.to_read;rpan();refreshOV()};$('#C-web').onclick=()=>api('open_url',{url:a.link});
        $('#C-bib').onclick=async()=>{const r=await api('bibtex',{uid:a.uid});await copyText(r.bibtex);$('#C-bib').textContent='✓ Copied'}}}
    $$('#C-rt button').forEach(b=>b.onclick=()=>{rt=b.dataset.t;rpan()})}
  $('#C-logo').onclick=()=>{$('#C-q').value='';q='';home()};
  onOV(()=>{const s=$('#C-sync');if(s)s.textContent=syncLabel()});
  ENTER.C=()=>{if(!started){started=true;R.setTheme(rTheme('C')||'day',true)}if(!cur)home()};
})();

(async()=>{await refreshOV();show(['A','B','C'].includes(OV.settings.concept)?OV.settings.concept:'A');if(OV.sync&&OV.sync.running)pollSync()})();
</script>
<script src="citations.js"></script>
</body>
</html>
